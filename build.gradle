import wynnphoton.gradle.ApplyPatchesTask
import wynnphoton.gradle.DownloadFileTask
import wynnphoton.gradle.GeneratePatchBundleTask
import wynnphoton.gradle.InstallTestWorldTask
import wynnphoton.gradle.MakePatchesTask
import wynnphoton.gradle.PrepareDevClientTask

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		// The patch format/applier is shared with the Gradle tasks in buildSrc,
		// so the patches are written and applied by the same code.
		java.srcDir 'patcher-core/src/main/java'
	}
	// Dev only: the lighting screenshot test (gradlew lightTest). Never part of the mod jar.
	lighttest {
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

repositories {
	// Mods for the dev client (gradlew dev), from Modrinth's Maven
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Only in the dev client, never in the mod's dependencies: the Wynncraft shader stack.
	modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.dev_fabric_api_version}"
	modLocalRuntime "maven.modrinth:sodium:${project.dev_sodium_version}"
	modLocalRuntime "maven.modrinth:wynniris:${project.dev_wynniris_version}"
	modLocalRuntime "maven.modrinth:photonics:${project.dev_photonics_version}"
	modLocalRuntime "maven.modrinth:voxy:${project.dev_voxy_version}"
	modLocalRuntime "maven.modrinth:modmenu:${project.dev_modmenu_version}"

	// The libraries WynnIris and Voxy nest in their jars (META-INF/jars). Fabric Loader doesn't load jars nested in
	// classpath mods, so the dev client needs them listed. Versions match the nested jars.
	[
		'org.anarres:jcpp:1.4.14',
		'org.antlr:antlr4-runtime:4.13.1',
		'io.github.douira:glsl-transformer:3.0.0-pre3',
		'org.rocksdb:rocksdbjni:10.2.1',
		'org.lz4:lz4-java:1.8.0',
		'org.tukaani:xz:1.10',
		'redis.clients:jedis:5.1.0',
		'org.apache.commons:commons-pool2:2.12.0',
		'org.lwjgl:lwjgl-lmdb:3.3.3',
		'org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows',
		'org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux',
		'org.lwjgl:lwjgl-zstd:3.3.3',
		'org.lwjgl:lwjgl-zstd:3.3.3:natives-windows',
		'org.lwjgl:lwjgl-zstd:3.3.3:natives-linux',
	].each { localRuntime(it) { transitive = false } }

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// -----------------------------------------------------------------------------
// Photon patch workflow
//
//   .photon/            downloaded Photon release + its extracted copy (base/)   [gitignored]
//   patches/            one unified diff per changed Photon file                  [committed]
//   work/               editable Photon = base + patches                          [gitignored]
//
//   gradlew applyPatches    rebuild work/ from base + patches
//   gradlew makePatches     turn your edits in work/ back into patches/
//   gradlew installDevPack  copy work/ into your shaderpacks folder for live testing
// -----------------------------------------------------------------------------

def photonDir = layout.projectDirectory.dir('.photon')
def baseDir = photonDir.dir('base')
def patchesDir = layout.projectDirectory.dir('patches')
def workDir = layout.projectDirectory.dir('work')
def workSnapshot = photonDir.file('work.sha256')

def downloadPhoton = tasks.register('downloadPhoton', DownloadFileTask) {
	group = 'wynn-photon'
	description = "Downloads ${photon_display_name} from Modrinth and checks its hash."
	url = project.photon_url
	sha512 = project.photon_sha512
	outputFile = photonDir.file("${photon_pack_name}.zip")
}

def extractPhoton = tasks.register('extractPhoton', Sync) {
	group = 'wynn-photon'
	description = "Extracts ${photon_display_name} into .photon/base."
	dependsOn downloadPhoton
	from(zipTree(downloadPhoton.flatMap { it.outputFile }))
	into baseDir
}

tasks.register('applyPatches', ApplyPatchesTask) {
	group = 'wynn-photon'
	description = 'Rebuilds work/ from the base Photon pack plus patches/. Refuses to discard unsaved edits unless -Pforce is given.'
	dependsOn extractPhoton
	it.baseDir = baseDir
	it.patchesDir = patchesDir
	it.workDir = workDir
	it.snapshotFile = workSnapshot
	force = providers.gradleProperty('force').map { it != 'false' }.orElse(false)
}

tasks.register('makePatches', MakePatchesTask) {
	group = 'wynn-photon'
	description = 'Writes the differences between the base Photon pack and work/ into patches/.'
	dependsOn extractPhoton
	it.baseDir = baseDir
	it.patchesDir = patchesDir
	it.workDir = workDir
	it.snapshotFile = workSnapshot
}

def generatePatchBundle = tasks.register('generatePatchBundle', GeneratePatchBundleTask) {
	group = 'wynn-photon'
	description = 'Packages patches/ with a manifest describing the base pack they apply to.'
	dependsOn extractPhoton
	it.baseDir = baseDir
	it.patchesDir = patchesDir
	patchName = project.patch_name
	modVersion = project.version.toString()
	baseName = project.photon_pack_name
	baseDisplayName = project.photon_display_name
	outputDir = layout.buildDirectory.dir('generated/patchBundle')
}

// Where installDevPack copies work/ to. Set shaderpacksDir in local.properties (gitignored)
// or pass -PshaderpacksDir=... Use forward slashes.
def localProps = new Properties()
def localPropsFile = file('local.properties')
if (localPropsFile.exists()) {
	localPropsFile.withReader('UTF-8') { localProps.load(it) }
}
def devShaderpacks = providers.gradleProperty('shaderpacksDir').getOrElse(localProps.getProperty('shaderpacksDir', ''))
def devPackName = "${photon_pack_name} + ${patch_name}-dev"

tasks.register('installDevPack', Sync) {
	group = 'wynn-photon'
	description = "Copies work/ into <shaderpacksDir>/${devPackName} so it can be tried in game (press R to reload shaders)."
	def configured = !devShaderpacks.isBlank()
	from workDir
	into(configured ? "${devShaderpacks}/${devPackName}" : layout.buildDirectory.dir('unconfigured-dev-pack'))
	doFirst {
		if (!configured) {
			throw new GradleException('Set shaderpacksDir in local.properties (or pass -PshaderpacksDir=...) to use installDevPack.')
		}
		if (!workDir.asFile.exists()) {
			throw new GradleException('work/ does not exist yet. Run applyPatches first.')
		}
	}
}

// installTestWorld: the creative superflat "Wynn-Photon Test" world with a gallery of every block Wynn-Photon
// changes. It goes in the instance that holds shaderpacksDir. See testworld/README.md.
def installDevPack = tasks.named('installDevPack')
tasks.register('installTestWorld', InstallTestWorldTask) {
	group = 'wynn-photon'
	description = 'Installs the Wynn-Photon test world, with the Wynncraft resource pack, and selects the dev shader pack. -Pfresh starts the world over.'
	dependsOn installDevPack
	def configured = !devShaderpacks.isBlank()
	instanceDir = configured ? file(devShaderpacks).parentFile : layout.buildDirectory.dir('unconfigured-instance').get().asFile
	datapackDir = layout.projectDirectory.dir('testworld/datapack')
	worldName = 'Wynn-Photon Test'
	shaderPack = devPackName
	fresh = providers.gradleProperty('fresh').isPresent()
	doFirst {
		if (!configured) {
			throw new GradleException('Set shaderpacksDir in local.properties (or pass -PshaderpacksDir=...) to use installTestWorld.')
		}
	}
}

// -----------------------------------------------------------------------------
// Dev client: gradlew dev
//
// Starts Minecraft with Sodium, WynnIris, Photonics, Voxy and this mod, straight into the "Wynn-Photon Test" world,
// with work/ linked in as the shader pack and the Wynncraft resource pack in the world. Everything lives in run/.
// -----------------------------------------------------------------------------

def devRunDir = layout.projectDirectory.dir('run')

// work/ is built on the first run only, so gradlew dev never touches unsaved edits.
def applyPatchesIfMissing = tasks.register('applyPatchesIfMissing', ApplyPatchesTask) {
	description = 'Builds work/ if it does not exist yet.'
	dependsOn extractPhoton
	it.baseDir = baseDir
	it.patchesDir = patchesDir
	it.workDir = workDir
	it.snapshotFile = workSnapshot
	force = false
	onlyIf { !workDir.dir('shaders').asFile.exists() }
}

def prepareDevClient = tasks.register('prepareDevClient', PrepareDevClientTask) {
	description = 'Links work/ into run/shaderpacks and adds the Photon zip for the dev client.'
	dependsOn applyPatchesIfMissing, downloadPhoton
	it.runDir = devRunDir
	it.workDir = workDir
	photonZip = photonDir.file("${photon_pack_name}.zip")
	it.devPackName = devPackName
}

def installDevTestWorld = tasks.register('installDevTestWorld', InstallTestWorldTask) {
	description = 'Installs the test world into run/ for the dev client. -Pfresh starts it over.'
	dependsOn prepareDevClient
	instanceDir = devRunDir
	datapackDir = layout.projectDirectory.dir('testworld/datapack')
	// Wynncraft's resource pack isn't downloadable outside the game, so take the one Minecraft cached when you joined
	// Wynncraft: from wynncraftInstanceDir (local.properties), the instance holding shaderpacksDir, or .minecraft.
	def packSources = []
	def wynnInstance = providers.gradleProperty('wynncraftInstanceDir').getOrElse(localProps.getProperty('wynncraftInstanceDir', ''))
	if (!wynnInstance.isBlank()) packSources << file(wynnInstance)
	if (!devShaderpacks.isBlank()) packSources << file(devShaderpacks).parentFile
	if (System.getenv('APPDATA')) packSources << file("${System.getenv('APPDATA')}/.minecraft")
	packSources << file("${System.getProperty('user.home')}/.minecraft")
	packSources << file("${System.getProperty('user.home')}/Library/Application Support/minecraft")
	packSourceInstances.from(packSources)
	worldName = 'Wynn-Photon Test'
	shaderPack = devPackName
	fresh = providers.gradleProperty('fresh').isPresent()
}

def lightTestCases = layout.projectDirectory.file('testworld/light_test.txt')
def lightTestOut = layout.buildDirectory.dir('light-test')

loom {
	mods {
		wynn_photon {
			sourceSet sourceSets.main
		}
		wynn_photon_lighttest {
			sourceSet sourceSets.lighttest
		}
	}
	runs {
		dev {
			client()
			configName = 'Wynn-Photon dev client'
			runDir 'run'
			programArgs '--quickPlaySingleplayer', 'Wynn-Photon Test'
		}
		// The dev client plus the lighttest source set, which photographs every case and then closes the game.
		// -Ponly=<regex> shoots only the cases whose file name (<spot>__<time>__<set>.png) matches.
		lightTest {
			client()
			configName = 'Wynn-Photon light test'
			runDir 'run'
			source sourceSets.lighttest
			programArgs '--quickPlaySingleplayer', 'Wynn-Photon Test', '--width', '960', '--height', '540'
			property 'wynnphoton.lightTest', lightTestCases.asFile.absolutePath
			property 'wynnphoton.lightTest.out', lightTestOut.get().asFile.absolutePath
			property 'wynnphoton.lightTest.only', providers.gradleProperty('only').getOrElse('')
		}
	}
}

tasks.named('runDev') {
	group = 'wynn-photon'
	description = 'Starts the dev client in the Wynn-Photon test world.'
	dependsOn installDevTestWorld
}

// -----------------------------------------------------------------------------
// Lighting test: gradlew lightTest
//
// Photographs the light test spots of the test world under the option sets in testworld/light_test.txt, with nobody
// at the keyboard, and writes build/light-test/report.html. See docs/DEVELOPMENT.md.
// -----------------------------------------------------------------------------

tasks.named('runLightTest') {
	description = 'Runs the dev client through every lighting test case and saves the screenshots.'
	dependsOn installDevTestWorld
}

def lightTestReport = tasks.register('lightTestReport', JavaExec) {
	group = 'wynn-photon'
	description = 'Writes build/light-test/report.html from the screenshots of the last lightTest run.'
	classpath = sourceSets.lighttest.output
	mainClass = 'com.wynnphoton.lighttest.LightTestReport'
	args lightTestCases.asFile.absolutePath, lightTestOut.get().asFile.absolutePath
	mustRunAfter 'runLightTest'
}

tasks.register('lightTest') {
	group = 'wynn-photon'
	description = 'Photographs every lighting test case in the dev client and writes build/light-test/report.html.'
	dependsOn 'runLightTest', lightTestReport
}

tasks.register('dev') {
	group = 'wynn-photon'
	description = 'Starts the dev client in the Wynn-Photon test world (same as runDev).'
	dependsOn 'runDev'
}

jar {
	from('LICENSE') {
		rename { "LICENSE_wynn-photon.txt" }
	}
}

processResources {
	def version = project.version
	inputs.property 'version', version

	from(generatePatchBundle)

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

test {
	useJUnitPlatform()
	dependsOn downloadPhoton
	systemProperty 'wynnphoton.photonZip', photonDir.file("${photon_pack_name}.zip").asFile.absolutePath
}

import wynnphoton.gradle.ApplyPatchesTask
import wynnphoton.gradle.BuildPatchedPackTask
import wynnphoton.gradle.DownloadFileTask
import wynnphoton.gradle.GeneratePatchBundleTask
import wynnphoton.gradle.InstallTestWorldTask
import wynnphoton.gradle.MakePatchesTask
import wynnphoton.gradle.PrepareDevClientTask

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		// The layout of the jar's wynn_photon/ folder is shared with the Gradle tasks in buildSrc,
		// so the build writes it and the mod reads it with the same names.
		java.srcDir 'bundle-format/src/main/java'
	}
	// Dev only: the lighting screenshot test (gradlew lightTest). Never part of the mod jar.
	lighttest {
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

repositories {
	// Mods for the dev client (gradlew dev), from Modrinth's Maven
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Only in the dev client, never in the mod's dependencies: the Wynncraft shader stack.
	modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.dev_fabric_api_version}"
	modLocalRuntime "maven.modrinth:sodium:${project.dev_sodium_version}"
	modLocalRuntime "maven.modrinth:wynniris:${project.dev_wynniris_version}"
	modLocalRuntime "maven.modrinth:photonics:${project.dev_photonics_version}"
	modLocalRuntime "maven.modrinth:voxy:${project.dev_voxy_version}"
	modLocalRuntime "maven.modrinth:modmenu:${project.dev_modmenu_version}"

	// The libraries WynnIris and Voxy nest in their jars (META-INF/jars). Fabric Loader doesn't load jars nested in
	// classpath mods, so the dev client needs them listed. Versions match the nested jars.
	[
		'org.anarres:jcpp:1.4.14',
		'org.antlr:antlr4-runtime:4.13.1',
		'io.github.douira:glsl-transformer:3.0.0-pre3',
		'org.rocksdb:rocksdbjni:10.2.1',
		'org.lz4:lz4-java:1.8.0',
		'org.tukaani:xz:1.10',
		'redis.clients:jedis:5.1.0',
		'org.apache.commons:commons-pool2:2.12.0',
		'org.lwjgl:lwjgl-lmdb:3.3.3',
		'org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows',
		'org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux',
		'org.lwjgl:lwjgl-zstd:3.3.3',
		'org.lwjgl:lwjgl-zstd:3.3.3:natives-windows',
		'org.lwjgl:lwjgl-zstd:3.3.3:natives-linux',
	].each { localRuntime(it) { transitive = false } }

	// Verifies the base pack and applies the patch. Nested in the mod jar; it bundles its own dependencies.
	implementation "com.euphoriapatches:shaderpatcher:${project.shaderpatcher_version}"
	include "com.euphoriapatches:shaderpatcher:${project.shaderpatcher_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// -----------------------------------------------------------------------------
// Photon patch workflow
//
//   .photon/            downloaded Photon release + its extracted copy (base/)   [gitignored]
//   patches/            one unified diff per changed Photon file                  [committed]
//   work/               editable Photon = base + patches                          [gitignored]
//
//   gradlew applyPatches    rebuild work/ from base + patches
//   gradlew makePatches     turn your edits in work/ back into patches/
//   gradlew installDevPack  copy work/ into your shaderpacks folder for live testing
// -----------------------------------------------------------------------------

def photonDir = layout.projectDirectory.dir('.photon')
def baseDir = photonDir.dir('base')
def patchesDir = layout.projectDirectory.dir('patches')
def workDir = layout.projectDirectory.dir('work')
def workSnapshot = photonDir.file('work.sha256')

def downloadPhoton = tasks.register('downloadPhoton', DownloadFileTask) {
	group = 'wynn-photon'
	description = "Downloads ${photon_display_name} from Modrinth and checks its hash."
	url = project.photon_url
	sha512 = project.photon_sha512
	outputFile = photonDir.file("${photon_pack_name}.zip")
}

def extractPhoton = tasks.register('extractPhoton', Sync) {
	group = 'wynn-photon'
	description = "Extracts ${photon_display_name} into .photon/base."
	dependsOn downloadPhoton
	from(zipTree(downloadPhoton.flatMap { it.outputFile }))
	into baseDir
}

tasks.register('applyPatches', ApplyPatchesTask) {
	group = 'wynn-photon'
	description = 'Rebuilds work/ from the base Photon pack plus patches/. Refuses to discard unsaved edits unless -Pforce is given.'
	dependsOn extractPhoton
	it.baseDir = baseDir
	it.patchesDir = patchesDir
	it.workDir = workDir
	it.snapshotFile = workSnapshot
	force = providers.gradleProperty('force').map { it != 'false' }.orElse(false)
}

tasks.register('makePatches', MakePatchesTask) {
	group = 'wynn-photon'
	description = 'Writes the differences between the base Photon pack and work/ into patches/.'
	dependsOn extractPhoton
	it.baseDir = baseDir
	it.patchesDir = patchesDir
	it.workDir = workDir
	it.snapshotFile = workSnapshot
}

def generatePatchBundle = tasks.register('generatePatchBundle', GeneratePatchBundleTask) {
	group = 'wynn-photon'
	description = 'Turns patches/ into the ShaderPatcher patch the mod applies, with a manifest describing the base pack.'
	dependsOn extractPhoton
	it.baseDir = baseDir
	baseZip = downloadPhoton.flatMap { it.outputFile }
	it.patchesDir = patchesDir
	patchName = project.patch_name
	modVersion = project.version.toString()
	baseName = project.photon_pack_name
	baseDisplayName = project.photon_display_name
	outputDir = layout.buildDirectory.dir('generated/patchBundle')
}

// patchedPackZip: the patched pack as a ready-to-use shader pack zip, for the GitHub release only (Photon's licence
// doesn't allow it on Modrinth or CurseForge). Handy for test setups of other mods that skip the patcher. It has no
// top-level folder, so shaders/ sits at the zip root the way Iris expects.
def buildPatchedPack = tasks.register('buildPatchedPack', BuildPatchedPackTask) {
	description = 'Writes base + patches into build/patchedPack.'
	dependsOn extractPhoton
	it.baseDir = baseDir
	it.patchesDir = patchesDir
	outputDir = layout.buildDirectory.dir('patchedPack')
}

tasks.register('patchedPackZip', Zip) {
	group = 'wynn-photon'
	description = "Zips the patched pack as build/distributions/${photon_pack_name}_${patch_name}_<version>.zip."
	from buildPatchedPack
	archiveFileName = "${photon_pack_name}_${patch_name}_${project.version}.zip"
	destinationDirectory = layout.buildDirectory.dir('distributions')
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

// Where installDevPack copies work/ to. Set shaderpacksDir in local.properties (gitignored)
// or pass -PshaderpacksDir=... Use forward slashes.
def localProps = new Properties()
def localPropsFile = file('local.properties')
if (localPropsFile.exists()) {
	localPropsFile.withReader('UTF-8') { localProps.load(it) }
}
def devShaderpacks = providers.gradleProperty('shaderpacksDir').getOrElse(localProps.getProperty('shaderpacksDir', ''))
def devPackName = "${photon_pack_name} + ${patch_name}-dev"

tasks.register('installDevPack', Sync) {
	group = 'wynn-photon'
	description = "Copies work/ into <shaderpacksDir>/${devPackName} so it can be tried in game (press R to reload shaders)."
	def configured = !devShaderpacks.isBlank()
	from workDir
	into(configured ? "${devShaderpacks}/${devPackName}" : layout.buildDirectory.dir('unconfigured-dev-pack'))
	doFirst {
		if (!configured) {
			throw new GradleException('Set shaderpacksDir in local.properties (or pass -PshaderpacksDir=...) to use installDevPack.')
		}
		if (!workDir.asFile.exists()) {
			throw new GradleException('work/ does not exist yet. Run applyPatches first.')
		}
	}
}

// installTestWorld: the creative superflat "Wynn-Photon Test" world with a gallery of every block Wynn-Photon
// changes. It goes in the instance that holds shaderpacksDir. See testworld/README.md.
def installDevPack = tasks.named('installDevPack')
tasks.register('installTestWorld', InstallTestWorldTask) {
	group = 'wynn-photon'
	description = 'Installs the Wynn-Photon test world, with the Wynncraft resource pack, and selects the dev shader pack. -Pfresh starts the world over.'
	dependsOn installDevPack
	def configured = !devShaderpacks.isBlank()
	instanceDir = configured ? file(devShaderpacks).parentFile : layout.buildDirectory.dir('unconfigured-instance').get().asFile
	datapackDir = layout.projectDirectory.dir('testworld/datapack')
	worldName = 'Wynn-Photon Test'
	shaderPack = devPackName
	fresh = providers.gradleProperty('fresh').isPresent()
	doFirst {
		if (!configured) {
			throw new GradleException('Set shaderpacksDir in local.properties (or pass -PshaderpacksDir=...) to use installTestWorld.')
		}
	}
}

// -----------------------------------------------------------------------------
// Dev client: gradlew dev
//
// Starts Minecraft with Sodium, WynnIris, Photonics, Voxy and this mod, straight into the "Wynn-Photon Test" world,
// with work/ linked in as the shader pack and the Wynncraft resource pack in the world. Everything lives in run/.
// -----------------------------------------------------------------------------

def devRunDir = layout.projectDirectory.dir('run')

// work/ is built on the first run only, so gradlew dev never touches unsaved edits.
def applyPatchesIfMissing = tasks.register('applyPatchesIfMissing', ApplyPatchesTask) {
	description = 'Builds work/ if it does not exist yet.'
	dependsOn extractPhoton
	it.baseDir = baseDir
	it.patchesDir = patchesDir
	it.workDir = workDir
	it.snapshotFile = workSnapshot
	force = false
	onlyIf { !workDir.dir('shaders').asFile.exists() }
}

def prepareDevClient = tasks.register('prepareDevClient', PrepareDevClientTask) {
	description = 'Links work/ into run/shaderpacks and adds the Photon zip for the dev client.'
	dependsOn applyPatchesIfMissing, downloadPhoton
	it.runDir = devRunDir
	it.workDir = workDir
	photonZip = photonDir.file("${photon_pack_name}.zip")
	it.devPackName = devPackName
}


// Wynncraft's resource pack isn't downloadable outside the game, so the test worlds take the one Minecraft cached when
// you joined Wynncraft: from wynncraftInstanceDir (local.properties), the instance holding shaderpacksDir, or .minecraft.
def wynnPackSources = []
def wynnInstance = providers.gradleProperty('wynncraftInstanceDir').getOrElse(localProps.getProperty('wynncraftInstanceDir', ''))
if (!wynnInstance.isBlank()) wynnPackSources << file(wynnInstance)
if (!devShaderpacks.isBlank()) wynnPackSources << file(devShaderpacks).parentFile
if (System.getenv('APPDATA')) wynnPackSources << file("${System.getenv('APPDATA')}/.minecraft")
wynnPackSources << file("${System.getProperty('user.home')}/.minecraft")
wynnPackSources << file("${System.getProperty('user.home')}/Library/Application Support/minecraft")

def installDevTestWorld = tasks.register('installDevTestWorld', InstallTestWorldTask) {
	description = 'Installs the test world into run/ for the dev client. -Pfresh starts it over.'
	dependsOn prepareDevClient
	instanceDir = devRunDir
	datapackDir = layout.projectDirectory.dir('testworld/datapack')
	packSourceInstances.from(wynnPackSources)
	worldName = 'Wynn-Photon Test'
	shaderPack = devPackName
	fresh = providers.gradleProperty('fresh').isPresent()
}

// The Wynncraft map world for mapTest: a world of air whose Voxy storage is a copy of a Wynncraft Voxy cache, so Voxy
// draws the Wynncraft map around the player, as WynnVista's Voxy fixture does. The cache is voxyCache in
// local.properties (-PvoxyCache=...), or else the biggest Wynncraft world in the .voxy folder of the instance holding
// shaderpacksDir. Close Minecraft before the first copy. -Pfresh copies it again.
def voxyCachePath = providers.gradleProperty('voxyCache').orElse(providers.provider {
	def explicit = localProps.getProperty('voxyCache', '')
	if (!explicit.isBlank()) return explicit
	if (devShaderpacks.isBlank()) return null
	def saves = file(devShaderpacks).parentFile.toPath().resolve('.voxy/saves/play.wynncraft.com').toFile()
	def biggest = saves.listFiles()?.findAll { new File(it, 'storage/CURRENT').isFile() }?.max { dir ->
		new File(dir, 'storage').listFiles().sum { it.length() } ?: 0L
	}
	return biggest == null ? null : new File(biggest, 'storage').path
})

def installMapWorld = tasks.register('installMapWorld', InstallTestWorldTask) {
	group = 'wynn-photon'
	description = 'Installs the Wynncraft map world (Voxy LODs) into run/ for mapTest. -Pfresh copies the LODs again.'
	dependsOn prepareDevClient
	instanceDir = devRunDir
	packSourceInstances.from(wynnPackSources)
	worldName = 'Wynn-Photon Map'
	shaderPack = devPackName
	voidWorld = true
	voxyCache.set(layout.dir(voxyCachePath.map { new File(it) }))
	fresh = providers.gradleProperty('fresh').isPresent()
	doFirst {
		if (!voxyCachePath.isPresent()) {
			throw new GradleException('No Wynncraft Voxy cache found. Set voxyCache in local.properties to '
					+ '<instance>/.voxy/saves/play.wynncraft.com/<world id>/storage.')
		}
	}
}

// The screenshot tests. Each is a dev client run with the lighttest source set, which photographs every case of its
// case file and then closes the game, and a report task. -Ponly=<regex> shoots only the cases whose file name
// (<spot>__<time>__<set>.png) matches. See "The screenshot tests" in docs/DEVELOPMENT.md.
def screenshotTests = [
	lightTest: [cases: 'testworld/light_test.txt', out: 'light-test', world: 'Wynn-Photon Test', size: [960, 540],
				install: installDevTestWorld, title: 'lighting test',
				what: 'Photographs every lighting test case in the dev client'],
	skyTest  : [cases: 'testworld/sky_test.txt', out: 'sky-test', world: 'Wynn-Photon Test', size: [1600, 900],
				install: installDevTestWorld, title: 'sky test',
				what: 'Photographs the sun and moon at every sky test case in the dev client'],
	mapTest  : [cases: 'testworld/map_test.txt', out: 'map-test', world: 'Wynn-Photon Map', size: [1600, 900],
				install: installMapWorld, title: 'map test',
				what: 'Photographs the Wynncraft map (Voxy LODs) at every map test case in the dev client'],
]

loom {
	mods {
		wynn_photon {
			sourceSet sourceSets.main
		}
		wynn_photon_lighttest {
			sourceSet sourceSets.lighttest
		}
	}
	runs {
		dev {
			client()
			configName = 'Wynn-Photon dev client'
			runDir 'run'
			programArgs '--quickPlaySingleplayer', 'Wynn-Photon Test'
		}
		screenshotTests.each { name, test ->
			create(name) {
				client()
				configName = "Wynn-Photon ${test.title}"
				runDir 'run'
				source sourceSets.lighttest
				programArgs '--quickPlaySingleplayer', test.world,
						'--width', test.size[0].toString(), '--height', test.size[1].toString()
				property 'wynnphoton.lightTest', file(providers.gradleProperty('cases').getOrElse(test.cases)).absolutePath
				property 'wynnphoton.lightTest.out', layout.buildDirectory.dir(test.out).get().asFile.absolutePath
				property 'wynnphoton.lightTest.only', providers.gradleProperty('only').getOrElse('')
				property 'wynnphoton.lightTest.frames', providers.gradleProperty('frames').getOrElse('0')
			}
		}
	}
}

tasks.named('runDev') {
	group = 'wynn-photon'
	description = 'Starts the dev client in the Wynn-Photon test world.'
	dependsOn installDevTestWorld
}

// -----------------------------------------------------------------------------
// Screenshot tests: gradlew lightTest, skyTest, mapTest
//
// Each photographs the cases of its file in testworld/ with nobody at the keyboard and writes
// build/<light|sky|map>-test/report.html. See docs/DEVELOPMENT.md.
// -----------------------------------------------------------------------------

screenshotTests.each { name, test ->
	def runName = 'run' + name.capitalize()
	def outDir = layout.buildDirectory.dir(test.out)
	tasks.named(runName) {
		description = "Runs the dev client through every ${test.title} case and saves the screenshots."
		dependsOn test.install
	}
	def report = tasks.register("${name}Report", JavaExec) {
		group = 'wynn-photon'
		description = "Writes build/${test.out}/report.html from the screenshots of the last ${name} run."
		classpath = sourceSets.lighttest.output
		mainClass = 'com.wynnphoton.lighttest.LightTestReport'
		args file(providers.gradleProperty('cases').getOrElse(test.cases)).absolutePath, outDir.get().asFile.absolutePath
		mustRunAfter runName
	}
	tasks.register(name) {
		group = 'wynn-photon'
		description = "${test.what} and writes build/${test.out}/report.html."
		dependsOn runName, report
	}
}

// The map world must never let Voxy ingest its empty chunks over the copied Wynncraft LODs. Voxy reads
// ingest_enabled from run/config/voxy-config.json when it starts, so runMapTest switches it off there for the run and
// puts the file back afterwards, even when the run fails. (The harness also refuses to shoot if it finds it on.)
def voxyConfig = devRunDir.file('config/voxy-config.json').asFile
def voxyConfigBackup = layout.buildDirectory.file('map-test/voxy-config-before-test.json').get().asFile
def restoreVoxyConfig = tasks.register('restoreVoxyConfig') {
	description = 'Puts back run/config/voxy-config.json after runMapTest.'
	doLast {
		if (voxyConfigBackup.isFile()) {
			java.nio.file.Files.move(voxyConfigBackup.toPath(), voxyConfig.toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}
tasks.named('runMapTest') {
	finalizedBy restoreVoxyConfig
	doFirst {
		if (voxyConfig.isFile()) {
			voxyConfigBackup.parentFile.mkdirs()
			if (!voxyConfigBackup.isFile()) {
				java.nio.file.Files.copy(voxyConfig.toPath(), voxyConfigBackup.toPath())
			}
			def config = new groovy.json.JsonSlurper().parse(voxyConfig)
			config.ingest_enabled = false
			voxyConfig.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)) + '\n'
		} else {
			throw new GradleException("${voxyConfig} does not exist yet. Start the dev client once (gradlew dev).")
		}
	}
}

tasks.register('dev') {
	group = 'wynn-photon'
	description = 'Starts the dev client in the Wynn-Photon test world (same as runDev).'
	dependsOn 'runDev'
}

jar {
	from('LICENSE') {
		rename { "LICENSE_wynn-photon.txt" }
	}
}

processResources {
	def version = project.version
	inputs.property 'version', version

	from(generatePatchBundle)

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

test {
	useJUnitPlatform()
	dependsOn downloadPhoton
	systemProperty 'wynnphoton.photonZip', photonDir.file("${photon_pack_name}.zip").asFile.absolutePath
}

// The unified-diff parser and applier live in buildSrc (wynnphoton.gradle.patch), and Gradle doesn't run buildSrc's
// tests on its own. That package needs only the JDK, so it and its tests are compiled again here and run with check.
sourceSets {
	patchToolTest {
		java {
			srcDirs = ['buildSrc/src/main/java', 'buildSrc/src/test/java']
			include 'wynnphoton/gradle/patch/**'
		}
	}
}

dependencies {
	patchToolTestImplementation platform("org.junit:junit-bom:${project.junit_version}")
	patchToolTestImplementation 'org.junit.jupiter:junit-jupiter'
	patchToolTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def patchToolTest = tasks.register('patchToolTest', Test) {
	group = 'verification'
	description = 'Runs the tests of the patch tooling in buildSrc.'
	testClassesDirs = sourceSets.patchToolTest.output.classesDirs
	classpath = sourceSets.patchToolTest.runtimeClasspath
	useJUnitPlatform()
}

tasks.named('check') {
	dependsOn patchToolTest
}

# Publishes WynnPhoton to Modrinth and CurseForge (and attaches the jar to the GitHub release).
# The GitHub release also gets the patched pack as a ready-to-use zip, for test setups that skip the patcher.
# Photon's licence only allows the patcher on Modrinth and CurseForge, so the zip goes to GitHub alone.
#
# How to release:
#   1. Bump mod_version in gradle.properties and commit.
#   2. Create a GitHub release (e.g. tag v<version>). The release title becomes the version name,
#      the release notes become the changelog. A tag ending in -alpha/-beta (or a version containing
#      alpha/beta) is published as that release channel.
#   Or run it by hand from the Actions tab (workflow_dispatch); that skips the GitHub upload.
#
# Needs repository secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN.
# A platform with an empty project ID below is skipped.
# Modrinth requires WynnIris and the Photon shader pack, pinned to the Photon version the patches apply to (the
# "Pin Photon on Modrinth" step). WynnIris isn't on CurseForge, so CurseForge lists Iris instead. CurseForge mods
# can't depend on shader packs.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  MODRINTH_ID: "jl9IlGRb"
  CURSEFORGE_ID: "1811616"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Gradle daemon runs on Java 25 (gradle/gradle-daemon-jvm.properties); the mod targets Java 21.
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # build also runs the tests, which download the Photon base pack from Modrinth and apply patches/ to it.
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build patchedPackZip

      # GitHub only: mc-publish's files go to every platform, so the zip is uploaded on its own.
      - name: Attach patched pack to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*.zip --clobber

      - name: Publish
        id: publish
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_ID != '' && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_ID != '' && secrets.CURSEFORGE_TOKEN || '' }}
          github-token: ${{ github.event_name == 'release' && secrets.GITHUB_TOKEN || '' }}

          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: fabric
          game-versions: 1.21.11
          java: 21
          dependencies: |
            iris(optional){curseforge:irisshaders}#(ignore:modrinth)
            wynniris(required){modrinth:wynniris}#(ignore:curseforge)
            photon-shader(required){modrinth:lLqFfGNs}#(ignore:curseforge)

      # mc-publish sends Modrinth a project ID per dependency but never a version, so this sets the new version's
      # dependency list again through the Modrinth API, with Photon pinned. The Photon version ID comes from
      # photon_url in gradle.properties, so moving to a new Photon there moves the pin too.
      - name: Pin Photon on Modrinth
        if: env.MODRINTH_ID != '' && steps.publish.outputs.modrinth-version != ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION_ID: ${{ steps.publish.outputs.modrinth-version }}
          WYNNIRIS: pa6h8e27
          PHOTON: lLqFfGNs
        run: |
          photon_version=$(sed -n 's#^photon_url=.*/versions/\([^/]*\)/.*#\1#p' gradle.properties)
          test -n "$photon_version"
          curl --fail-with-body -sS -X PATCH "https://api.modrinth.com/v2/version/$VERSION_ID" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: DrBiznes/wynn-photon (publish workflow)" \
            -d "{\"dependencies\": [
              {\"project_id\": \"$WYNNIRIS\", \"dependency_type\": \"required\"},
              {\"project_id\": \"$PHOTON\", \"version_id\": \"$photon_version\", \"dependency_type\": \"required\"}
            ]}"
          echo "Modrinth version $VERSION_ID requires WynnIris and Photon version $photon_version"

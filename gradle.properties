org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric (https://fabricmc.net/develop)
minecraft_version=1.21.11
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod
mod_version=0.3.0
maven_group=com.wynnphoton
archives_base_name=wynn-photon
# Used in the patched pack's folder name: "<photon_pack_name> + <patch_name>_<mod_version>"
patch_name=WynnPhoton

# The Photon release every file in patches/ is made against.
# Changing these means rebasing the patches: see README.md, "Updating to a new Photon release".
photon_pack_name=photon_v1.4
photon_display_name=Photon v1.4
photon_url=https://cdn.modrinth.com/data/lLqFfGNs/versions/BnGklH5y/photon_v1.4.zip
photon_sha512=2dec87084dccf91a72a06235ecbfb3627f066699b5f70583f06077cba61433aedbfa6af28eb68bf1cdc726149cc3d9a587517cfab59e6a24e9d6a40b6874d655

junit_version=5.11.4


# Mods in the dev client only (gradlew dev), from Modrinth's Maven. Voxy pins exact Sodium versions.
# Voxy and Mod Menu are pinned by Modrinth version ID: their version numbers are shared with builds for other
# Minecraft versions, and Modrinth's Maven may pick the wrong one.
dev_fabric_api_version=0.141.6+1.21.11
dev_sodium_version=mc1.21.11-0.8.12-fabric
dev_wynniris_version=1.2.2+1.21.11-fabric
dev_photonics_version=0.3.4+1.21.11
# voxy 0.2.16-beta for 1.21.11; modmenu 17.0.1
dev_voxy_version=H3w2nVdU
dev_modmenu_version=cLkYaVuL
